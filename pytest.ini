[pytest]
testpaths = tests
# Lets tests import src.* and serving.* from the repository root.
pythonpath = .
addopts = -ra
# Starlette's deprecation warnings (e.g. TestClient used with plain httpx instead of httpx2)
# fail the run, so that problem cannot creep back.
filterwarnings =
    error::starlette.exceptions.StarletteDeprecationWarning
